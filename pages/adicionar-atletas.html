<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adicionar Atleta</title>
  <link rel="stylesheet" href="../css/adicionar-atletas.css" />
</head>
<body>

<div class="atletas-titulo-wrapper">
  <h1 class="atletas-titulo">Atletas</h1>
</div>


<main class="atletas-conteudo">

 
  <div class="form-topo">
    </a>
    <button class="btn-salvar" id="btnSalvar">
      <img src="../src/assets/IMG/salvar.png" class="icone-salvar" >
      Salvar
    </button>
  </div>

  
  <div class="form-card">

   
    <div class="form-foto-col">
      <div class="foto-preview" id="fotoPreview">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <img id="fotoImg" src="" alt="" style="display:none;">
      </div>
      <label class="btn-foto" for="inputFoto">
        <img src="../src/assets/IMG/camera.png" class="icone-camera">
        Adicionar foto
      </label>
      <input type="file" id="inputFoto" accept="image/*" style="display:none;">
    </div>

    
    <div class="form-divisor"></div>

    <div class="form-campos">

      <div class="form-row">
        <div class="campo-grupo">
          <label class="campo-label">Nome</label>
          <input type="text" class="campo-input" placeholder="Nome completo" id="campoNome">
        </div>
        <div class="campo-grupo">
          <label class="campo-label">Número</label>
          <input type="text" class="campo-input" placeholder="Ex: 10" id="campoNumero">
        </div>
      </div>

      <div class="form-row">
        <div class="campo-grupo">
          <label class="campo-label">Posição</label>
          <input type="text" class="campo-input" placeholder="Ex: Líbero" id="campoPosicao">
        </div>
        <div class="campo-grupo">
          <label class="campo-label">RG</label>
          <input type="text" class="campo-input" placeholder="00.000.000-0" id="campoRg">
        </div>
      </div>

      <div class="form-row">
        <div class="campo-grupo">
          <label class="campo-label">Idade</label>
          <input type="text" class="campo-input" placeholder="Ex: 22" id="campoIdade">
        </div>
        <div class="campo-grupo">
          <label class="campo-label">CPF</label>
          <input type="text" class="campo-input" placeholder="000.000.000-00" id="campoCpf">
        </div>
      </div>

      <div class="form-row">
        <div class="campo-grupo">
          <label class="campo-label">Altura</label>
          <input type="text" class="campo-input" placeholder="Ex: 1,75m" id="campoAltura">
        </div>
        <div class="campo-grupo">
          <label class="campo-label">Peso</label>
          <input type="text" class="campo-input" placeholder="Ex: 65kg" id="campoPeso">
        </div>
      </div>

    </div>
  </div>

</main>


<footer class="rodape">
  <a href="atletas.html" class="botao-inicio">
   <img src="../src/assets/IMG/voltar.png" class="icone-voltar">
   voltar
  </a>
</footer>

<div class="aviso" id="aviso">✔ Atleta salvo com sucesso!</div>

</body>
</html>
